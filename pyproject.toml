[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airalert"
version = "0.1.0"
description = "Прогноз повітряних тривог у районах України"
requires-python = ">=3.12"
dependencies = [
    "certifi",
    "duckdb",
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "pyogrio",
    "python-dotenv",
    "scikit-learn",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
